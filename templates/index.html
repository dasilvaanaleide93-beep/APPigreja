<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paroquia Santa Terezinha</title>
<style>
body{margin:0;font-family:Arial;background:#f4f6f8;text-align:center}
.topo img{width:100%;height:280px;object-fit:cover;display:block}
.container{max-width:600px;margin:20px auto;padding:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
.card{background:white;border-radius:15px;padding:20px;text-decoration:none;color:#333}
.card span{font-size:30px;display:block}
.grande{grid-column:span 2;background:#2c5aa0;color:white;font-size:18px}
</style>
</head>
<body>
<div class="topo">
<img src="/static/santa.webp">
<h1>Paroquia Santa Terezinha</h1>
<p>Bem-vinda!</p>
</div>
<div class="container">
<div class="grid">
<a class="card grande" href="/liturgia"><span>📖</span>Liturgia Diaria</a>
<a class="card" href="/pedidos"><span>🙏</span>Pedidos de Oracao</a>
<a class="card" href="/mural"><span>💬</span>Mural de Recados</a>
<a class="card" href="/doacoes"><span>❤️</span>Doacoes</a>
</div>
</div>
</body>
</html>
